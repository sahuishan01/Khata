name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","heaven"]') }}

    services:
      postgres:
        image: ${{ github.event_name == 'pull_request' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: khata
          POSTGRES_PASSWORD: khata
          POSTGRES_DB: khata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests connect as khata_app, NOT as the POSTGRES_USER bootstrap role:
      # that role is a superuser, and superusers bypass RLS entirely, which
      # breaks the RLS-isolation tests. See the "Prepare database" step.
      DATABASE_URL: postgresql://khata_app:khata@127.0.0.1:5432/khata
      RO_DATABASE_URL: postgresql://khata_ro:khata_ro@127.0.0.1:5432/khata
      PGPORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use installed Rust on VPS
        if: runner.environment == 'self-hosted'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/cargo-clippy" --version

      - name: Install Rust
        if: runner.environment != 'self-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        if: runner.environment != 'self-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start isolated test database on VPS
        if: runner.environment == 'self-hosted'
        env:
          CI_POSTGRES_PASSWORD: khata
        run: |
          pg_bin=$(pg_config --bindir)
          pg_data="$RUNNER_TEMP/khata-postgres"
          "$pg_bin/initdb" -D "$pg_data" --username=khata \
            --auth-local=trust --auth-host=scram-sha-256 \
            --pwfile=<(printf '%s\n' "$CI_POSTGRES_PASSWORD")
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/postgres.log" \
            -o "-h 127.0.0.1 -p 25432 -k $RUNNER_TEMP" -w start
          "$pg_bin/createdb" -h "$RUNNER_TEMP" -p 25432 -U khata khata
          echo 'PGPORT=25432' >> "$GITHUB_ENV"
          echo 'DATABASE_URL=postgresql://khata_app:khata@127.0.0.1:25432/khata' >> "$GITHUB_ENV"
          echo 'RO_DATABASE_URL=postgresql://khata_ro:khata_ro@127.0.0.1:25432/khata' >> "$GITHUB_ENV"

      - name: Prepare database
        # 1. Migration 0006 (RLS) does `GRANT SELECT ... TO khata_ro` but never
        #    creates the role — dev and prod provision it out of band. Roles are
        #    cluster-global, so creating it once here covers every `#[sqlx::test]`
        #    ephemeral DB.
        # 2. POSTGRES_USER is a superuser, and superusers BYPASS RLS entirely,
        #    so the RLS-isolation tests fail their negative assertions when the
        #    suite runs as that role. A role also cannot drop its own superuser
        #    bit ("permission denied to alter role"), so create a separate
        #    non-superuser role for the tests to connect as. CREATEDB lets
        #    `#[sqlx::test]` provision its ephemeral databases.
        run: |
          PGPASSWORD=khata psql -h 127.0.0.1 -p "$PGPORT" -U khata -d khata \
            -c "CREATE ROLE khata_ro LOGIN PASSWORD 'khata_ro';" \
            -c "CREATE ROLE khata_app LOGIN PASSWORD 'khata' CREATEDB;" \
            -c "GRANT ALL PRIVILEGES ON DATABASE khata TO khata_app;"

      - name: Fetch pdfium
        working-directory: backend
        run: |
          ./scripts/fetch-pdfium.sh linux x64
          echo "PDFIUM_LIB_PATH=$PWD/.pdfium/lib" >> "$GITHUB_ENV"

      - name: Test SMS decision privacy and policy
        run: python3 -m unittest discover -s ops/laya -p 'test_*.py' -v

      - name: Test
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Clippy
        # `-D warnings` is deferred: the backend carries ~40 pre-existing
        # clippy warnings unrelated to this workflow. Tighten once that
        # debt is cleared.
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets

      - name: Build verified backend deployment artifact
        if: github.event_name == 'push'
        run: |
          cargo build --release --locked --bin khata --manifest-path backend/Cargo.toml
          mkdir -p deploy
          install -m 755 backend/target/release/khata deploy/khata
          install -m 644 backend/.pdfium/lib/libpdfium.so deploy/libpdfium.so
          git rev-parse HEAD > deploy/REVISION
          cd deploy
          sha256sum khata libpdfium.so > SHA256SUMS

      - name: Upload verified backend
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: khata-backend-${{ github.sha }}
          path: deploy/
          if-no-files-found: error
          retention-days: 14

      - name: Stop isolated test database
        if: always() && runner.environment == 'self-hosted'
        run: |
          pg_data="$RUNNER_TEMP/khata-postgres"
          if [ -f "$pg_data/postmaster.pid" ]; then
            "$(pg_config --bindir)/pg_ctl" -D "$pg_data" -m fast -w stop
          fi
          rm -rf "$pg_data"

  web:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","heaven"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git rev-parse HEAD > dist/REVISION
      - name: Upload verified web frontend
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: khata-web-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
