name: SMS Decision Policy

on:
  push:
    branches: [master]
    paths: ['ops/laya/**', '.github/workflows/sms-policy.yml']
  pull_request:
    branches: [master]
    paths: ['ops/laya/**', '.github/workflows/sms-policy.yml']

permissions:
  contents: read

jobs:
  privacy-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pure policy tests use a fake model and only Python's standard library.
      - run: python3 -m unittest discover -s ops/laya -p 'test_*.py' -v
