name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore keystore from secrets
        if: ${{ env.UPLOAD_KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > app/upload.keystore
          cat > keystore.properties <<EOF
          storeFile=upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=khata-upload
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/khata_${VERSION}-debug.apk" 2>/dev/null || true
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/khata_${VERSION}-release.apk" 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Khata ${{ steps.version.outputs.version }}
          body: |
            ## Khata Android App v${{ steps.version.outputs.version }}

            ### Installation
            Download the APK below and install it on your Android device.
            You may need to enable "Install from unknown sources" in Settings.

            ### Changelog
            See the commits in this release for details.
          files: |
            android/app/build/outputs/apk/debug/khata_${{ steps.version.outputs.version }}-debug.apk
            android/app/build/outputs/apk/release/khata_${{ steps.version.outputs.version }}-release.apk
