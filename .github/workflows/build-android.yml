name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: lenovo-self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Create local.properties
        shell: powershell
        working-directory: android
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { "$env:LOCALAPPDATA\Android\Sdk" }
          if ($sdk) {
            $sdk = $sdk.Trim().Replace('\','/')
            "sdk.dir=$sdk" | Out-File -FilePath local.properties -Encoding utf8
            Write-Host "sdk.dir=$sdk"
          } else {
            Write-Host "No Android SDK found, skipping local.properties"
          }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Clean build cache
        shell: cmd
        working-directory: android
        run: |
          if exist "app\build" rmdir /s /q "app\build"
          ..\gradlew.bat --stop 2>nul
          exit /b 0

      - name: Build debug APK
        run: .\gradlew.bat assembleDebug --build-cache --parallel
        working-directory: android
        shell: cmd
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build release APK
        run: .\gradlew.bat assembleRelease --build-cache --parallel
        working-directory: android
        shell: cmd
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Get version from tag
        id: version
        run: echo "version=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: powershell

      - name: Rename APKs
        shell: powershell
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $debugSrc = "app\build\outputs\apk\debug\app-debug.apk"
          $releaseSrc = "app\build\outputs\apk\release\app-release.apk"
          if (Test-Path $debugSrc) {
            copy $debugSrc "app\build\outputs\apk\debug\khata_$env:VERSION-debug.apk"
            remove-item $debugSrc
          }
          if (Test-Path $releaseSrc) {
            copy $releaseSrc "app\build\outputs\apk\release\khata_$env:VERSION-release.apk"
            remove-item $releaseSrc
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Khata ${{ steps.version.outputs.version }}
          body: |
            ## Khata Android App v${{ steps.version.outputs.version }}

            ### Installation
            Download the APK below and install it on your Android device.
            You may need to enable "Install from unknown sources" in Settings.

            ### Changelog
            See the commits in this release for details.
          files: |
            android/app/build/outputs/apk/debug/khata_${{ steps.version.outputs.version }}-debug.apk
            android/app/build/outputs/apk/release/khata_${{ steps.version.outputs.version }}-release.apk
