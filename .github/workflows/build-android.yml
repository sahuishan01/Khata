name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  check:
    runs-on: [self-hosted, linux, x64, heaven]
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine build version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(git describe --tags --match 'v[0-9]*' --abbrev=0)
            version=${version#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for app changes since the previous tag
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A cancelled/unpublished tag is not an installed-app baseline.
          # Compare against the last successful signed release with an APK.
          prev_tag=''
          successful_tags=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs" \
            --method GET -f status=success -f event=push -F per_page=50 \
            --jq '.workflow_runs[].head_branch')
          while IFS= read -r candidate; do
            [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            git rev-parse --quiet --verify "refs/tags/$candidate" >/dev/null || continue
            has_apk=$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets | any(.name | endswith("-release.apk"))' 2>/dev/null) || continue
            if [ "$has_apk" = true ]; then
              prev_tag=$candidate
              break
            fi
          done <<< "$successful_tags"
          if [ -z "$prev_tag" ]; then
            echo "no previous tag found; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "diffing android/ between $prev_tag and $GITHUB_REF_NAME"
          if git diff --quiet "$prev_tag" "$GITHUB_REF_NAME" -- android/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: [self-hosted, linux, x64, heaven]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore keystore from secrets
        working-directory: android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
        run: |
          umask 077
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            echo "::error::UPLOAD_KEYSTORE_B64 secret is not set; a signed release cannot be built." >&2
            exit 1
          fi
          signing_dir=$(mktemp -d "${RUNNER_RUNTIME_DIR:-$RUNNER_TEMP}/khata-signing.XXXXXX")
          echo "KHATA_SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$signing_dir/upload.keystore"
          cat > "$signing_dir/keystore.properties" <<EOF
          storeFile=$signing_dir/upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-khata-upload}
          keyPassword=$KEY_PASSWORD
          EOF
          ln -s "$signing_dir/keystore.properties" keystore.properties

      - name: Build release APK
        run: GITHUB_REF_NAME="v$CI_VERSION" ./gradlew clean testReleaseUnitTest assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI_VERSION: ${{ needs.check.outputs.version }}

      - name: Report release unit tests
        working-directory: android
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testReleaseUnitTest').glob('TEST-*.xml')]
          assert suites, 'Release unit-test results are missing'
          tests = sum(int(s.get('tests', 0)) for s in suites)
          failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          assert failures == 0, 'Release regression tests failed'
          message = f'Android release unit tests: {tests} passed, {failures} failed.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
          PY

      - name: Verify SMS metadata in the minified APK
        working-directory: android
        run: |
          python3 - <<'PY'
          import zipfile
          apk = 'app/build/outputs/apk/release/app-release.apk'
          with zipfile.ZipFile(apk) as archive:
              dex = [archive.read(name) for name in archive.namelist() if name.endswith('.dex')]
          for field in ('sms_source', 'parser_version', 'received_at', 'body_hash', 'event_key', 'date_source', 'parsed_date', 'payment_role', 'card_account_key', 'user_edited', 'parsed_payee', 'payment_method', 'classifier_version'):
              assert any(field.encode() in content for content in dex), f'Release APK lost SMS field: {field}'
          print('Minified APK retains all required SMS metadata fields.')
          PY

      - name: Get version from tag
        id: version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/khata_${VERSION}-release.apk"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Khata ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          body: |
            ## Khata Android App v${{ steps.version.outputs.version }}

            ### Installation
            Download the APK below and install it on your Android device.
            You may need to enable "Install from unknown sources" in Settings.

            ### Changelog
            See the commits in this release for details.
          files: |
            android/app/build/outputs/apk/release/khata_${{ steps.version.outputs.version }}-release.apk

      - name: Upload verified APK for manual runner checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: khata-runner-check-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        working-directory: android
        run: |
          rm -f keystore.properties app/upload.keystore
          if [ -n "${KHATA_SIGNING_DIR:-}" ]; then
            rm -rf -- "$KHATA_SIGNING_DIR"
          fi
