name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for app changes since the previous tag
        id: diff
        run: |
          prev_tag=$(git tag --sort=-v:refname --merged "$GITHUB_REF_NAME" | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$prev_tag" ]; then
            echo "no previous tag found; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "diffing android/ between $prev_tag and $GITHUB_REF_NAME"
          if git diff --quiet "$prev_tag" "$GITHUB_REF_NAME" -- android/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore keystore from secrets
        working-directory: android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            echo "::error::UPLOAD_KEYSTORE_B64 secret is not set; a signed release cannot be built." >&2
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > app/upload.keystore
          cat > keystore.properties <<EOF
          storeFile=upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-khata-upload}
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew clean testReleaseUnitTest assembleRelease --no-daemon
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Report release unit tests
        working-directory: android
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testReleaseUnitTest').glob('TEST-*.xml')]
          assert suites, 'Release unit-test results are missing'
          tests = sum(int(s.get('tests', 0)) for s in suites)
          failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          assert failures == 0, 'Release regression tests failed'
          message = f'Android release unit tests: {tests} passed, {failures} failed.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
          PY

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/khata_${VERSION}-release.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Khata ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          body: |
            ## Khata Android App v${{ steps.version.outputs.version }}

            ### Installation
            Download the APK below and install it on your Android device.
            You may need to enable "Install from unknown sources" in Settings.

            ### Changelog
            See the commits in this release for details.
          files: |
            android/app/build/outputs/apk/release/khata_${{ steps.version.outputs.version }}-release.apk
