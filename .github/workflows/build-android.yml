name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore keystore from secrets
        if: ${{ env.UPLOAD_KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > app/upload.keystore
          cat > keystore.properties <<EOF
          storeFile=upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=khata-upload
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build debug APK
        id: build-debug
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build-debug.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        working-directory: android
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Show debug build errors
        if: always() && steps.build-debug.outputs.exit_code != '0'
        run: |
          echo "::group::Debug build error output"
          tail -80 /tmp/build-debug.log
          echo "::endgroup::"
          # Extract Kotlin/Java compile errors
          grep -E "e:|error:|FAILED|Exception" /tmp/build-debug.log | tail -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
        shell: bash

      - name: Build release APK
        id: build-release
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build-release.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        working-directory: android
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Show release build errors
        if: always() && steps.build-release.outputs.exit_code != '0'
        run: |
          echo "::group::Release build error output"
          tail -80 /tmp/build-release.log
          echo "::endgroup::"
          grep -E "e:|error:|FAILED|Exception" /tmp/build-release.log | tail -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
        shell: bash

      - name: Fail if any build failed
        if: steps.build-debug.outputs.exit_code != '0' || steps.build-release.outputs.exit_code != '0'
        run: |
          echo "Debug exit: ${{ steps.build-debug.outputs.exit_code }}"
          echo "Release exit: ${{ steps.build-release.outputs.exit_code }}"
          exit 1
        shell: bash

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: List APK outputs
        if: always()
        shell: bash
        working-directory: android
        run: |
          echo "=== Debug APKs ==="
          find app/build/outputs/apk/debug -name "*.apk" -ls 2>/dev/null || echo "No debug APKs found"
          echo "=== Release APKs ==="
          find app/build/outputs/apk/release -name "*.apk" -ls 2>/dev/null || echo "No release APKs found"
          echo "=== All build outputs ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || echo "No APKs anywhere"

      - name: Rename APKs
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Version: $VERSION"
          echo "Debug APK contents:"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug dir"
          echo "Release APK contents:"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/khata_${VERSION}-debug.apk"
            echo "Debug APK renamed"
          else
            echo "::warning::Debug APK not found at expected path"
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/khata_${VERSION}-release.apk"
            echo "Release APK renamed"
          else
            echo "::warning::Release APK not found at expected path"
          fi
          echo "After rename:"
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || echo "No APKs"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Khata ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          body: |
            ## Khata Android App v${{ steps.version.outputs.version }}

            ### Installation
            Download the APK below and install it on your Android device.
            You may need to enable "Install from unknown sources" in Settings.

            ### Changelog
            See the commits in this release for details.
          files: |
            android/app/build/outputs/apk/debug/khata_${{ steps.version.outputs.version }}-debug.apk
            android/app/build/outputs/apk/release/khata_${{ steps.version.outputs.version }}-release.apk
