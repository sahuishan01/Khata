[package]
name = "khata"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres",
  "uuid", "chrono", "macros", "migrate"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
calamine = "0.26"
csv = "1"
sqlparser = { version = "0.55", features = ["visitor"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
zip = "2"
dotenvy = "0.15"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
pdf-extract = "0.7"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
async-trait = "0.1.92"
futures = "0.3.34"
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pki-types = "1.15.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
regex = "1"
pdfium-render = { version = "=0.8.37", features = ["sync", "thread_safe"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
printpdf = "0.7"
